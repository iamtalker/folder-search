<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>폴더검색</title>
<style>
  :root {
    --bg: #fff; --fg: #222; --muted: #777; --border: #ddd;
    --accent: #2b73b7; --hl: #ff9; --card: #f7f7f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e1e; --fg:#e5e5e5; --muted:#999; --border:#3a3a3a; --accent:#6cb2ff; --hl:#6b5b00; --card:#2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; padding: 20px; }
  h1 { font-size: 1.3em; margin: 0 0 14px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 5px; padding: 7px 14px; cursor: pointer; font-size: 0.95em; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  input[type=text], select { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; font-size: 0.95em; }
  #query { flex: 1; min-width: 240px; }
  #extFilter { width: 340px; }
  .muted { color: var(--muted); font-size: 0.88em; }
  .status { font-size: 0.9em; color: var(--muted); }
  .sortbar { display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 14px; padding: 3px 6px 3px 12px; font-size: 0.85em; cursor: pointer; }
  .chip:hover { background: var(--accent); color: #fff; }
  .chip .x { opacity: 0.6; padding: 0 3px; border-radius: 50%; }
  .chip .x:hover { opacity: 1; }
  .chip.active { background: var(--accent); color: #fff; }
  .sortbar button.active { outline: 2px solid var(--accent); }
  #results { margin-top: 10px; }
  .result { border-bottom: 1px solid var(--border); padding: 10px 2px; }
  .result:last-child { border-bottom: none; }
  .result .path { font-weight: bold; cursor: pointer; }
  .result .path:hover { text-decoration: underline; }
  .result .meta { color: var(--muted); font-size: 0.82em; margin: 2px 0 4px; }
  .result .snippet { font-size: 0.92em; line-height: 1.5; white-space: pre-wrap; }
  .result .full { font-size: 0.9em; line-height: 1.5; white-space: pre-wrap; display: none; margin-top: 6px; max-height: 420px; overflow: auto; border-top: 1px dashed var(--border); padding-top: 6px; }
  .result.expanded .full { display: block; }
  mark { background: var(--hl); color: inherit; padding: 0 1px; }
  a.openlink { font-size: 0.82em; margin-left: 8px; }
  #unsupported { display: none; }
  #progress { display: none; }
  progress { width: 260px; }
</style>
</head>
<body>

<h1>폴더검색</h1>

<div id="unsupported" class="panel">
  이 브라우저는 폴더 선택 기능(File System Access API)을 지원하지 않습니다. Chrome 또는 Edge 최신 버전을 사용하시거나, 데스크톱 버전(run.bat)을 사용해주세요.
</div>

<div class="panel" id="setup">
  <div class="row">
    <button id="pickBtn">📁 폴더 선택</button>
    <button id="refreshBtn" class="secondary" disabled>🔄 새로고침</button>
    <span class="status" id="folderLabel">선택된 폴더 없음</span>
  </div>
  <div class="row" id="historyRow"></div>
  <div class="row">
    <label class="muted" for="extFilter">대상 확장자(쉼표로 구분, 비우면 전부):</label>
    <input type="text" id="extFilter" value="">
  </div>
  <div class="row">
    <label class="muted" for="excludeFilter">제외할 폴더 이름(쉼표로 구분):</label>
    <input type="text" id="excludeFilter" value="">
  </div>
  <div class="row" id="progress">
    <progress id="progressBar" value="0" max="1"></progress>
    <span class="status" id="progressLabel"></span>
  </div>
  <div class="status" id="indexStatus"></div>
</div>

<div class="panel">
  <div class="row">
    <input type="text" id="query" placeholder="검색어  (예: 회의록 AND (예산 OR 일정) NOT 취소)" disabled>
    <div class="sortbar">
      <button id="sortRelevance" class="secondary active">관련도순 ▼</button>
      <button id="sortTime" class="secondary">최신순</button>
    </div>
  </div>
  <div class="muted">공백=AND, OR / AND / NOT(제외) 및 괄호 지원, 큰따옴표로 "정확한 구절" 검색 가능</div>
  <div class="row">
    <label class="muted" for="dateFrom">검색일 기간:</label>
    <input type="text" id="dateFrom" placeholder="2021.01.01" style="width:110px">
    <span class="muted">~</span>
    <input type="text" id="dateTo" placeholder="" style="width:110px">
    <button id="dateClearBtn" class="secondary">기간 지우기</button>
  </div>
  <div class="row">
    <label class="muted" for="pageSizeSelect">페이지당 표시:</label>
    <select id="pageSizeSelect">
      <option value="20">20개</option>
      <option value="50" selected>50개</option>
      <option value="100">100개</option>
      <option value="200">200개</option>
      <option value="500">500개</option>
    </select>
  </div>
  <div class="status" id="resultStatus"></div>
</div>

<div id="results"></div>

<div class="panel row" id="pagerRow" style="display:none; justify-content:center;">
  <button id="prevPageBtn" class="secondary">◀ 이전</button>
  <span class="status" id="pageInfo"></span>
  <button id="nextPageBtn" class="secondary">다음 ▶</button>
  <input type="text" id="pageJumpInput" placeholder="페이지 번호" style="width:90px">
  <button id="pageJumpBtn" class="secondary">이동</button>
</div>

<script>
(function () {
  'use strict';

  var pickBtn = document.getElementById('pickBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var folderLabel = document.getElementById('folderLabel');
  var historyRowEl = document.getElementById('historyRow');
  var extFilterInput = document.getElementById('extFilter');
  var excludeFilterInput = document.getElementById('excludeFilter');
  var progressWrap = document.getElementById('progress');
  var progressBar = document.getElementById('progressBar');
  var progressLabel = document.getElementById('progressLabel');
  var queryInput = document.getElementById('query');
  var dateFromInput = document.getElementById('dateFrom');
  var dateToInput = document.getElementById('dateTo');
  var dateClearBtn = document.getElementById('dateClearBtn');
  (function setTodayPlaceholder() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    dateToInput.placeholder = d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
  })();
  var sortRelevanceBtn = document.getElementById('sortRelevance');
  var sortTimeBtn = document.getElementById('sortTime');
  var pageSizeSelect = document.getElementById('pageSizeSelect');
  var resultStatus = document.getElementById('resultStatus');
  var indexStatus = document.getElementById('indexStatus');
  var resultsEl = document.getElementById('results');
  var unsupportedEl = document.getElementById('unsupported');
  var setupEl = document.getElementById('setup');
  var pagerRow = document.getElementById('pagerRow');
  var pageInfo = document.getElementById('pageInfo');
  var prevPageBtn = document.getElementById('prevPageBtn');
  var nextPageBtn = document.getElementById('nextPageBtn');
  var pageJumpInput = document.getElementById('pageJumpInput');
  var pageJumpBtn = document.getElementById('pageJumpBtn');

  var currentRef = null;   // path string (desktop) or FileSystemDirectoryHandle (web)
  var totalCount = 0;      // how many files the current folder indexed in total
  var sortMode = 'relevance';
  var sortAsc = false;     // clicking an already-active sort button again flips this
  var currentPage = 1;     // 1-indexed
  var pageSize = 50;

  function allowedExts() {
    var raw = extFilterInput.value.trim();
    if (!raw) return null; // null = allow everything
    return raw.split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
  }

  function excludedFolderNames() {
    var raw = excludeFilterInput.value.trim();
    return raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function extOf(name) {
    var i = name.lastIndexOf('.');
    return i === -1 ? '' : name.slice(i + 1).toLowerCase();
  }

  window.onScanProgress = function (done, total) {
    progressBar.setAttribute('max', total || 1);
    progressBar.value = done;
    progressLabel.textContent = done + ' / ' + total + '개 파일 읽음';
  };

  // Set by the desktop backend so indexStatus can show whether a scan was
  // actually served from main.py's on-disk cache or read live - added
  // because from the progress bar alone (chunked either way) it's hard to
  // tell caching is doing anything without a clock and a label.
  var lastScanSource = null;
  window.onScanSource = function (source, note) {
    lastScanSource = { source: source, note: note || '' };
  };

  // =====================================================================
  // Backend abstraction: same UI/search logic runs on top of either the
  // desktop app (pywebview -> Python does real filesystem access, no
  // Documents/Desktop restriction) or a plain browser (File System Access
  // API). Only these two objects differ; everything below them is shared.
  // =====================================================================

  var DesktopBackend = {
    openLinkLabel: '기본 프로그램으로 열기',
    // Python only ever holds one folder's documents at a time (self._docs),
    // so a JS-side "switch back to this folder instantly" cache would lie
    // about what's actually loaded server-side. main.py's own on-disk cache
    // already makes revisiting a folder fast; see its scan_folder docstring.
    usesSessionCache: false,

    init: async function () {
      return { history: await pywebview.api.get_history() };
    },
    pickFolder: async function () {
      return await pywebview.api.pick_folder();
    },
    useHistoryEntry: async function (entry) {
      return await pywebview.api.use_history_entry(entry.path);
    },
    removeHistory: async function (entry) {
      return await pywebview.api.remove_history(entry.path);
    },
    isCurrentEntry: function (entry, ref) {
      return entry.path === ref;
    },
    scanFolder: async function (ref, exts, excludeNames, forceRefresh) {
      // main.py reads (or loads from its own on-disk cache) the full file
      // content and keeps it server-side - it is deliberately never sent
      // here. Only progress numbers cross the bridge during a scan; see
      // runSearch() below for why, and main.py's scan_folder docstring for
      // the measurements behind it.
      return await pywebview.api.scan_folder(ref, exts, excludeNames, !!forceRefresh);
    },
    runSearch: async function (ref, query, sortMode, dateFrom, dateTo, sortAsc, page, pageSize) {
      return await pywebview.api.search(ref, query, sortMode, dateFrom, dateTo, sortAsc, page, pageSize);
    },
    getFileContent: async function (ref, doc) {
      return await pywebview.api.get_file_content(ref, doc.path);
    },
    openFile: async function (doc) {
      return await pywebview.api.open_file(doc.fullPath);
    }
  };

  var WebBackend = {
    openLinkLabel: '새 탭에서 열기',
    MAX_FILE_BYTES: 3 * 1024 * 1024,
    MAX_HISTORY: 8,
    DB_NAME: 'folder-search-db',
    STORE: 'handles',
    _docs: [],
    usesSessionCache: true,

    openDB: function () {
      var self = this;
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open(self.DB_NAME, 1);
        req.onupgradeneeded = function () { req.result.createObjectStore(self.STORE); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    },
    idbSet: function (key, value) {
      var self = this;
      return this.openDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(self.STORE, 'readwrite');
          tx.objectStore(self.STORE).put(value, key);
          tx.oncomplete = resolve;
          tx.onerror = function () { reject(tx.error); };
        });
      });
    },
    idbGet: function (key) {
      var self = this;
      return this.openDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(self.STORE, 'readonly');
          var req = tx.objectStore(self.STORE).get(key);
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      });
    },
    _addToHistory: async function (handle) {
      var history = (await this.idbGet('folderHistory').catch(function () { return []; })) || [];
      var filtered = [];
      for (var i = 0; i < history.length; i++) {
        var same = false;
        try { same = await handle.isSameEntry(history[i].handle); } catch (err) {}
        if (!same) filtered.push(history[i]);
      }
      filtered.unshift({ name: handle.name, handle: handle });
      if (filtered.length > this.MAX_HISTORY) filtered = filtered.slice(0, this.MAX_HISTORY);
      await this.idbSet('folderHistory', filtered).catch(function () {});
      return filtered;
    },

    init: async function () {
      return { history: (await this.idbGet('folderHistory').catch(function () { return []; })) || [] };
    },
    pickFolder: async function () {
      var handle;
      try {
        handle = await window.showDirectoryPicker();
      } catch (err) {
        return null; // user cancelled
      }
      var history = await this._addToHistory(handle);
      return { path: handle, name: handle.name, history: history };
    },
    useHistoryEntry: async function (entry) {
      var p;
      try {
        p = await entry.handle.requestPermission({ mode: 'read' });
      } catch (err) {
        return null;
      }
      if (p !== 'granted') return null;
      var history = await this._addToHistory(entry.handle);
      return { path: entry.handle, name: entry.handle.name, history: history };
    },
    removeHistory: async function (entry) {
      var history = (await this.idbGet('folderHistory').catch(function () { return []; })) || [];
      var filtered = [];
      for (var i = 0; i < history.length; i++) {
        var same = false;
        try { same = await entry.handle.isSameEntry(history[i].handle); } catch (err) {}
        if (!same) filtered.push(history[i]);
      }
      await this.idbSet('folderHistory', filtered).catch(function () {});
      return filtered;
    },
    isCurrentEntry: function (entry, ref) {
      return entry.handle === ref;
    },

    walk: async function* (handle, prefix, excludeSet) {
      var it;
      try {
        it = handle.entries();
      } catch (err) {
        return; // can't open this directory (permissions) - skip it entirely
      }
      while (true) {
        var result;
        try {
          result = await it.next();
        } catch (err) {
          return; // unreadable entry - stop this dir; parent carries on with siblings
        }
        if (result.done) return;
        var name = result.value[0], child = result.value[1];
        if (excludeSet.has(name)) continue;
        var path = prefix ? prefix + '/' + name : name;
        if (child.kind === 'directory') {
          yield* this.walk(child, path, excludeSet);
        } else {
          yield { name: name, path: path, handle: child };
        }
      }
    },

    scanFolder: async function (dirHandle, exts, excludeNames) {
      var self = this;
      var excludeSet = new Set(excludeNames || []);
      var entries = [];
      try {
        for await (const e of this.walk(dirHandle, '', excludeSet)) {
          if (exts && !exts.includes(extOf(e.name))) continue;
          entries.push(e);
        }
      } catch (err) { /* best effort */ }

      var newDocs = [];
      var total = entries.length;
      window.onScanProgress(0, total);

      var CHUNK = 40;
      for (var i = 0; i < entries.length; i += CHUNK) {
        var chunk = entries.slice(i, i + CHUNK);
        await Promise.all(chunk.map(async function (e) {
          try {
            var file = await e.handle.getFile();
            var content = '';
            if (file.size <= self.MAX_FILE_BYTES) {
              content = await file.text().catch(function () { return ''; });
            }
            newDocs.push({
              path: e.path,
              name: e.name,
              ext: extOf(e.name),
              mtime: file.lastModified,
              size: file.size,
              content: content,
              fileHandle: e.handle,
              // built once here instead of per-keystroke in runSearch/score -
              // for a large folder this string is tens of MB across all
              // docs, and re-lowercasing it on every search was the biggest
              // single cost of typing a query (see DesktopBackend's Python
              // side, which already caches this the same way at scan time)
              _haystack: (e.name + '\n' + content).toLowerCase()
            });
          } catch (err) { /* unreadable file, skip */ }
        }));
        window.onScanProgress(Math.min(i + CHUNK, total), total);
        await new Promise(function (r) { setTimeout(r, 0); }); // yield to UI
      }
      this._docs = newDocs;
      return newDocs.length;
    },

    // The web version has no Python<->JS bridge to worry about (everything
    // already lives in this same JS heap), so unlike DesktopBackend it just
    // runs the shared boolean-parser/scorer/snippet functions directly
    // in-process against the full content it already holds.
    runSearch: async function (ref, query, sortMode, dateFrom, dateTo, sortAsc, page, pageSize) {
      var q = (query || '').trim();
      var node = q ? parseQuery(q) : null;
      var positiveWords = [];
      if (node) collectPositiveWords(node, positiveWords);

      var matched = this._docs.filter(function (doc) {
        if (dateFrom != null && doc.mtime < dateFrom) return false;
        if (dateTo != null && doc.mtime > dateTo) return false;
        if (!node) return true;
        return evalNode(node, doc._haystack);
      });

      if (sortMode === 'relevance' && q) {
        matched.forEach(function (d) { d._score = score(d, positiveWords, q); });
        matched.sort(function (a, b) { return sortAsc ? a._score - b._score : b._score - a._score; });
      } else {
        matched.sort(function (a, b) { return sortAsc ? a.mtime - b.mtime : b.mtime - a.mtime; });
      }

      var start = (page - 1) * pageSize;
      var results = matched.slice(start, start + pageSize).map(function (doc) {
        return {
          path: doc.path, name: doc.name, ext: doc.ext, mtime: doc.mtime, size: doc.size,
          score: typeof doc._score === 'number' ? doc._score : null,
          // doc._haystack is "name\ncontent" lowercased; skip past the name
          // and the separator to get the already-lowercased content instead
          // of lowercasing it again here.
          snippet: snippetAround(doc.content, doc._haystack.slice(doc.name.length + 1), positiveWords, 120),
          matchedWords: positiveWords,
          fileHandle: doc.fileHandle
        };
      });
      return { total: this._docs.length, matchedTotal: matched.length, results: results };
    },
    getFileContent: async function (ref, doc) {
      var found = this._docs.filter(function (d) { return d.path === doc.path; })[0];
      return found ? found.content : null;
    },

    openFile: async function (doc) {
      try {
        var url;
        var found = this._docs.filter(function (d) { return d.path === doc.path; })[0];
        if (found && found.content) {
          // use the already-decoded text so the browser doesn't have to guess
          // the encoding (it often guesses wrong for Korean text otherwise)
          var blob = new Blob([found.content], { type: 'text/plain;charset=utf-8' });
          url = URL.createObjectURL(blob);
        } else if (found) {
          var file = await found.fileHandle.getFile();
          url = URL.createObjectURL(file);
        } else {
          return false;
        }
        window.open(url, '_blank');
        return true;
      } catch (err) {
        return false;
      }
    }
  };

  var Backend = null; // set to DesktopBackend or WebBackend once we know the environment

  function applyFolderResult(result) {
    if (!result) return false;
    currentRef = result.path;
    folderLabel.textContent = '폴더: ' + result.name;
    renderHistoryChips(result.history || []);
    return true;
  }

  // Caches the scanned doc list per folder (+ filter settings) for this
  // session, keyed by currentRef (a path string on desktop, a
  // FileSystemDirectoryHandle on web - history chips always reuse the same
  // handle instance, so this works for both). Switching back to a folder
  // you already read this session is then instant instead of re-reading
  // everything from disk, unless the extension/exclude filters changed.
  var scanCache = new Map();
  var SESSION_CACHE_LIMIT = 3; // folders' worth of docs to keep in memory at once

  function filterKey() {
    return JSON.stringify(allowedExts()) + '|' + JSON.stringify(excludedFolderNames());
  }

  async function scan(forceRefresh) {
    if (!currentRef) return;
    currentPage = 1; // a (re)scan means whatever page we were on no longer applies

    var fkey = filterKey();
    if (Backend.usesSessionCache) {
      var cached = scanCache.get(currentRef);
      if (!forceRefresh && cached && cached.filterKey === fkey) {
        totalCount = cached.total;
        // Backend._docs is a single shared array (only one folder's worth
        // at a time) - restore this folder's docs into it before searching,
        // otherwise a scan of a *different* folder done since would still
        // be sitting there and results would silently come from the wrong
        // folder while the label/count still say this one.
        Backend._docs = cached.docs;
        indexStatus.textContent = totalCount + '개 파일 인덱싱됨 (이 세션 메모리 캐시, 0ms)';
        await runSearch();
        return;
      }
    }

    pickBtn.disabled = true;
    refreshBtn.disabled = true;
    queryInput.disabled = true;
    progressWrap.style.display = 'flex';
    progressLabel.textContent = '파일 목록 확인 중...';
    progressBar.value = 0;
    lastScanSource = null;
    var t0 = performance.now();

    try {
      totalCount = await Backend.scanFolder(currentRef, allowedExts(), excludedFolderNames(), !!forceRefresh);
      if (Backend.usesSessionCache) {
        scanCache.set(currentRef, { filterKey: fkey, total: totalCount, docs: Backend._docs });
        // now that a cache entry holds the full doc array (+ each doc's
        // _haystack), it's real memory per folder, not just a number - cap
        // how many folders we hold onto at once. Map keeps insertion order,
        // so the oldest entry is always the first key.
        while (scanCache.size > SESSION_CACHE_LIMIT) scanCache.delete(scanCache.keys().next().value);
      }
    } catch (err) {
      progressLabel.textContent = '폴더를 읽는 중 오류: ' + err;
      totalCount = 0;
    }

    var elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    var sourceLabel = '';
    if (lastScanSource) {
      sourceLabel = lastScanSource.source === 'cache'
        ? ' (디스크 캐시에서 불러옴, ' + elapsed + '초)'
        : ' (새로 스캔함, ' + elapsed + '초' + (lastScanSource.note ? ' - ' + lastScanSource.note : '') + ')';
    } else {
      sourceLabel = ' (' + elapsed + '초)';
    }

    progressWrap.style.display = 'none';
    pickBtn.disabled = false;
    refreshBtn.disabled = false;
    queryInput.disabled = false;
    indexStatus.textContent = totalCount + '개 파일 인덱싱됨' + sourceLabel;
    await runSearch();
  }

  pickBtn.addEventListener('click', async function () {
    var result = await Backend.pickFolder();
    if (applyFolderResult(result)) await scan();
  });

  refreshBtn.addEventListener('click', function () { scan(true); });

  function renderHistoryChips(history) {
    historyRowEl.innerHTML = '';
    history.forEach(function (entry) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (Backend.isCurrentEntry(entry, currentRef) ? ' active' : '');
      chip.title = entry.path || entry.name;

      var label = document.createElement('span');
      label.textContent = entry.name;
      chip.appendChild(label);

      var x = document.createElement('span');
      x.className = 'x';
      x.textContent = '✕';
      x.title = '목록에서 제거';
      x.addEventListener('click', async function (e) {
        e.stopPropagation();
        var updated = await Backend.removeHistory(entry);
        renderHistoryChips(updated);
      });
      chip.appendChild(x);

      chip.addEventListener('click', async function () {
        var result = await Backend.useHistoryEntry(entry);
        if (!result) { alert('이 폴더를 더 이상 찾을 수 없습니다 (이동되었거나 삭제된 것 같아요).'); return; }
        if (applyFolderResult(result)) await scan();
      });
      historyRowEl.appendChild(chip);
    });
  }

  async function initApp() {
    var r = await Backend.init();
    var history = r.history || [];
    renderHistoryChips(history);
    if (history.length) {
      var result = await Backend.useHistoryEntry(history[0]);
      if (applyFolderResult(result)) await scan();
    }
  }

  function startDesktop() {
    Backend = DesktopBackend;
    initApp();
  }
  function startWeb() {
    Backend = WebBackend;
    if (!window.showDirectoryPicker) {
      unsupportedEl.style.display = 'block';
      setupEl.style.display = 'none';
      return;
    }
    initApp();
  }

  // Detect environment: pywebview injects window.pywebview and fires
  // 'pywebviewready'; a plain browser will never do either, so a short
  // timeout safely distinguishes the two without delaying real usage.
  (function detectEnvironment() {
    var settled = false;
    if (window.pywebview) { settled = true; startDesktop(); return; }
    window.addEventListener('pywebviewready', function () {
      if (settled) return;
      settled = true;
      startDesktop();
    });
    setTimeout(function () {
      if (settled) return;
      settled = true;
      startWeb();
    }, 150);
  })();

  // ---- boolean query parser: WORD / "phrase", AND (implicit or explicit), OR, NOT (exclude), parentheses ----

  function tokenize(q) {
    // depth tracks how many '(' are still unclosed. A plain \S+ match is
    // greedy and doesn't stop at ')', so "(NOT word)" without a space
    // before the ')' would otherwise swallow it into the word ("word)")
    // and leave the group unclosed. When depth > 0, peel a trailing run of
    // ')' off such a word (up to depth many) into their own tokens instead
    // - ')' is never a meaningful character inside an unquoted search word
    // once a group is open, so this can't misinterpret a literal word.
    var tokens = [];
    var re = /"([^"]*)"|\(|\)|\bAND\b|\bOR\b|\bNOT\b|\S+/g;
    var m;
    var depth = 0;
    while ((m = re.exec(q)) !== null) {
      var t = m[0];
      if (t === '(') { tokens.push({ type: '(' }); depth++; }
      else if (t === ')') { tokens.push({ type: ')' }); depth = Math.max(0, depth - 1); }
      else if (t === 'AND' || t === 'OR' || t === 'NOT') tokens.push({ type: t });
      else if (m[1] !== undefined) tokens.push({ type: 'WORD', value: m[1] });
      else {
        var stripped = t.replace(/\)+$/, '');
        var trailingClose = Math.min(depth, t.length - stripped.length);
        if (trailingClose) {
          var core = t.slice(0, t.length - trailingClose);
          if (core) tokens.push({ type: 'WORD', value: core });
          for (var i = 0; i < trailingClose; i++) tokens.push({ type: ')' });
          depth -= trailingClose;
        } else {
          tokens.push({ type: 'WORD', value: t });
        }
      }
    }
    return tokens;
  }

  function parseQuery(q) {
    var tokens = tokenize(q);
    var pos = 0;
    function peek() { return tokens[pos]; }
    function next() { return tokens[pos++]; }

    function parseOr() {
      var node = parseAnd();
      while (peek() && peek().type === 'OR') {
        next();
        node = { op: 'OR', left: node, right: parseAnd() };
      }
      return node;
    }
    function parseAnd() {
      var node = parseFactor();
      while (peek() && (peek().type === 'AND' || peek().type === 'NOT' || peek().type === 'WORD' || peek().type === '(')) {
        var op = 'AND';
        if (peek().type === 'AND' || peek().type === 'NOT') { op = next().type; }
        var right = parseFactor();
        if (!right) break;
        node = { op: op, left: node, right: right };
      }
      return node;
    }
    function parseFactor() {
      var t = peek();
      if (!t) return null;
      if (t.type === '(') {
        next();
        var node = parseOr();
        if (peek() && peek().type === ')') next();
        return node;
      }
      if (t.type === 'WORD') {
        next();
        return { op: 'WORD', value: t.value.toLowerCase() };
      }
      return null;
    }

    if (!tokens.length) return null;
    return parseOr();
  }

  function evalNode(node, haystack) {
    if (!node) return true;
    if (node.op === 'WORD') return haystack.indexOf(node.value) !== -1;
    if (node.op === 'AND') return evalNode(node.left, haystack) && evalNode(node.right, haystack);
    if (node.op === 'OR') return evalNode(node.left, haystack) || evalNode(node.right, haystack);
    if (node.op === 'NOT') return evalNode(node.left, haystack) && !evalNode(node.right, haystack);
    return true;
  }

  function collectPositiveWords(node, out) {
    if (!node) return;
    if (node.op === 'WORD') { out.push(node.value); return; }
    if (node.op === 'NOT') { collectPositiveWords(node.left, out); return; } // skip excluded side
    collectPositiveWords(node.left, out);
    collectPositiveWords(node.right, out);
  }

  function countOccurrences(haystack, needle) {
    if (!needle) return 0;
    var count = 0, idx = 0;
    while ((idx = haystack.indexOf(needle, idx)) !== -1) { count++; idx += needle.length; }
    return count;
  }

  function score(doc, positiveWords, rawQuery) {
    var raw = 0;
    positiveWords.forEach(function (w) { raw += countOccurrences(doc._haystack, w); });
    // Density (hits per character), not a raw count - otherwise a long file
    // that happens to contain a common query word many times (e.g. a huge
    // tweet archive with hundreds of hits on a word like "why") outscores a
    // short, precisely on-topic document that only has a couple of hits.
    // *1000 just keeps the displayed number in a readable range.
    var s = 1000 * raw / Math.max(1, doc._haystack.length);
    var lname = doc.name.toLowerCase();
    var q = rawQuery.trim().toLowerCase();
    if (q && (lname === q || lname === q + '.' + doc.ext)) s += 1000;
    else if (q && lname.indexOf(q) !== -1) s += 50;
    return s;
  }

  function highlight(text, words) {
    var out = escapeHtml(text);
    words.forEach(function (w) {
      if (!w) return;
      var re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      out = out.replace(re, '<mark>$1</mark>');
    });
    return out;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function snippetAround(content, lowerContent, words, radius) {
    if (!content) return '';
    var lower = lowerContent;
    var idx = -1;
    for (var i = 0; i < words.length && idx === -1; i++) {
      idx = lower.indexOf(words[i]);
    }
    if (idx === -1) return content.slice(0, radius * 2);
    var start = Math.max(0, idx - radius);
    var end = Math.min(content.length, idx + radius);
    return (start > 0 ? '…' : '') + content.slice(start, end) + (end < content.length ? '…' : '');
  }

  function fmtDate(ms) {
    var d = new Date(ms);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + 'B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
    return (bytes / 1024 / 1024).toFixed(1) + 'MB';
  }

  // Free-typed date fields (e.g. "2021.01.01") - accepts '.', '-' or '/' as
  // the separator and 1-2 digit month/day. Returns null if the field is
  // empty or doesn't parse as a plausible date, rather than throwing.
  function parseDateText(s) {
    s = (s || '').trim();
    if (!s) return null;
    var m = s.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
    if (!m) return null;
    var y = parseInt(m[1], 10), mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return { y: y, mo: mo, d: d };
  }

  // Converts the two date fields to inclusive ms bounds (start of day /
  // end of day, local time) against each doc's mtime; null on either side
  // means that side of the range isn't set (or doesn't parse).
  function dateRangeMs() {
    var f = parseDateText(dateFromInput.value);
    var t = parseDateText(dateToInput.value);
    var from = f ? new Date(f.y, f.mo - 1, f.d, 0, 0, 0, 0).getTime() : null;
    var to = t ? new Date(t.y, t.mo - 1, t.d, 23, 59, 59, 999).getTime() : null;
    return { from: from, to: to };
  }

  // Delegates to Backend.runSearch, which either asks Python to search
  // server-side (desktop - see main.py's search()) or filters/scores/sorts
  // this.​_docs in-process (web). Either way it comes back as a small,
  // already-paginated list with a snippet per result, not full content.
  var searchSeq = 0;
  async function runSearch() {
    var q = queryInput.value.trim();
    var range = dateRangeMs();
    var mySeq = ++searchSeq;
    var result = await Backend.runSearch(currentRef, q, sortMode, range.from, range.to, sortAsc, currentPage, pageSize);
    if (mySeq !== searchSeq) return; // a newer search finished first, drop this stale one

    resultStatus.textContent = result.total + '개 중 ' + result.matchedTotal + '개 일치';
    renderResults(result.results);
    renderPager(result.matchedTotal);
  }

  function renderPager(matchedTotal) {
    var totalPages = Math.max(1, Math.ceil(matchedTotal / pageSize));
    if (currentPage > totalPages) currentPage = totalPages; // e.g. filters just shrank the result set
    pagerRow.style.display = matchedTotal > pageSize ? 'flex' : 'none';
    pageInfo.textContent = currentPage + ' / ' + totalPages + ' 페이지';
    prevPageBtn.disabled = currentPage <= 1;
    nextPageBtn.disabled = currentPage >= totalPages;
  }

  function goToPage(p) {
    currentPage = Math.max(1, p | 0); // upper bound gets clamped in renderPager once matchedTotal is known
    runSearch();
  }

  function renderResults(list) {
    resultsEl.innerHTML = '';
    list.forEach(function (doc) {
      var words = doc.matchedWords || [];
      var div = document.createElement('div');
      div.className = 'result';

      var pathEl = document.createElement('div');
      pathEl.className = 'path';
      pathEl.innerHTML = highlight(doc.path, words);
      pathEl.addEventListener('click', async function () {
        div.classList.toggle('expanded');
        if (div.classList.contains('expanded') && !fullEl.dataset.filled) {
          fullEl.textContent = '불러오는 중...';
          var content = await Backend.getFileContent(currentRef, doc);
          fullEl.innerHTML = highlight(content || '(내용 없음 또는 너무 큰 파일)', words);
          fullEl.dataset.filled = '1';
        }
      });
      div.appendChild(pathEl);

      var openLink = document.createElement('a');
      openLink.href = '#';
      openLink.className = 'openlink';
      openLink.textContent = Backend.openLinkLabel;
      openLink.addEventListener('click', async function (e) {
        e.preventDefault();
        e.stopPropagation();
        var ok = await Backend.openFile(doc);
        if (!ok) alert('열 수 없습니다.');
      });
      pathEl.appendChild(openLink);

      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = fmtDate(doc.mtime) + ' · ' + fmtSize(doc.size) + (typeof doc.score === 'number' ? ' · 점수 ' + doc.score : '');
      div.appendChild(meta);

      var snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.innerHTML = highlight(doc.snippet || '', words);
      div.appendChild(snippet);

      var fullEl = document.createElement('div');
      fullEl.className = 'full';
      div.appendChild(fullEl);

      resultsEl.appendChild(div);
    });
  }

  var searchTimer = null;
  queryInput.addEventListener('input', debouncedSearch);

  function debouncedSearch() {
    currentPage = 1; // a new query/date range invalidates whatever page we were on
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 150);
  }
  dateFromInput.addEventListener('input', debouncedSearch);
  dateToInput.addEventListener('input', debouncedSearch);
  dateClearBtn.addEventListener('click', function () {
    dateFromInput.value = '';
    dateToInput.value = '';
    currentPage = 1;
    runSearch();
  });

  // Clicking the already-active sort button again flips ascending/descending
  // (e.g. 최신순 -> 오래된순) instead of doing nothing; switching to the
  // other sort mode always starts descending (highest score / newest first).
  function applySortLabels() {
    sortRelevanceBtn.textContent = '관련도순' + (sortMode === 'relevance' ? (sortAsc ? ' ▲' : ' ▼') : '');
    sortTimeBtn.textContent = (sortMode === 'time' && sortAsc ? '오래된순 ▲' : '최신순' + (sortMode === 'time' ? ' ▼' : ''));
  }
  function selectSort(mode) {
    if (sortMode === mode) {
      sortAsc = !sortAsc;
    } else {
      sortMode = mode;
      sortAsc = false;
    }
    sortRelevanceBtn.classList.toggle('active', sortMode === 'relevance');
    sortTimeBtn.classList.toggle('active', sortMode === 'time');
    applySortLabels();
    currentPage = 1;
    runSearch();
  }
  sortRelevanceBtn.addEventListener('click', function () { selectSort('relevance'); });
  sortTimeBtn.addEventListener('click', function () { selectSort('time'); });

  pageSizeSelect.addEventListener('change', function () {
    pageSize = parseInt(pageSizeSelect.value, 10) || 50;
    currentPage = 1;
    runSearch();
  });

  prevPageBtn.addEventListener('click', function () { goToPage(currentPage - 1); });
  nextPageBtn.addEventListener('click', function () { goToPage(currentPage + 1); });
  pageJumpBtn.addEventListener('click', function () {
    var n = parseInt(pageJumpInput.value, 10);
    if (n) goToPage(n);
  });
  pageJumpInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') pageJumpBtn.click();
  });
})();
</script>

</body>
</html>
